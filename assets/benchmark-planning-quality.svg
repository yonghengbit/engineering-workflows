<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Planning quality comparison</title>
  <desc id="desc">Engineering Workflows scored 81.2 percent, Superpowers 75 percent, and the native agent 62.5 percent on 48 frozen planning checks.</desc>
  <defs>
    <linearGradient id="ew" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8df7"/><stop offset="1" stop-color="#7457f5"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172554" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="960" height="500" rx="24" fill="#ffffff"/>
  <text x="56" y="62" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Planning quality · 48 frozen checks</text>
  <text x="56" y="94" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Higher is better · one planning-only run per condition</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <line x1="258" y1="134" x2="258" y2="409" stroke="#e2e8f0"/><line x1="404" y1="134" x2="404" y2="409" stroke="#e2e8f0" stroke-dasharray="4 6"/><line x1="550" y1="134" x2="550" y2="409" stroke="#e2e8f0" stroke-dasharray="4 6"/><line x1="696" y1="134" x2="696" y2="409" stroke="#e2e8f0" stroke-dasharray="4 6"/><line x1="842" y1="134" x2="842" y2="409" stroke="#e2e8f0" stroke-dasharray="4 6"/>
    <g fill="#94a3b8" font-size="13" text-anchor="middle"><text x="258" y="438">0%</text><text x="404" y="438">25%</text><text x="550" y="438">50%</text><text x="696" y="438">75%</text><text x="842" y="438">100%</text></g>
    <text x="56" y="182" fill="#334155" font-size="17" font-weight="600">Native agent</text><rect x="258" y="151" width="365" height="48" rx="12" fill="#cbd5e1"/><text x="641" y="182" fill="#334155" font-size="18" font-weight="700">62.5%</text>
    <text x="56" y="278" fill="#334155" font-size="17" font-weight="600">Superpowers v6.1.1</text><rect x="258" y="247" width="438" height="48" rx="12" fill="#8ea5ca"/><text x="714" y="278" fill="#334155" font-size="18" font-weight="700">75.0%</text>
    <text x="56" y="374" fill="#4338ca" font-size="17" font-weight="700">Engineering Workflows</text><rect x="258" y="343" width="474" height="48" rx="12" fill="url(#ew)" filter="url(#shadow)"/><text x="750" y="374" fill="#4338ca" font-size="18" font-weight="800">81.2%</text>
    <rect x="690" y="112" width="205" height="35" rx="17.5" fill="#eef2ff"/><text x="792" y="135" text-anchor="middle" fill="#4f46e5" font-size="14" font-weight="700">+6.2 pp vs Superpowers</text>
    <text x="56" y="475" fill="#94a3b8" font-size="12">Source: comparative benchmark v1 · 2026-08-13 · rubric SHA-256 frozen before runs</text>
  </g>
</svg>
