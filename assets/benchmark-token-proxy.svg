<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
  <title id="title">Token proxy comparison</title>
  <desc id="desc">Engineering Workflows used a combined proxy of 9,403 versus Superpowers at 19,766 and the native agent at 2,751. The proxy is character count divided by four, not billed tokens.</desc>
  <defs><linearGradient id="input" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8df7"/><stop offset="1" stop-color="#7457f5"/></linearGradient><pattern id="output" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#c4b5fd"/><rect width="3" height="8" fill="#8b5cf6"/></pattern></defs>
  <rect width="960" height="530" rx="24" fill="#ffffff"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="56" y="62" fill="#0f172a" font-size="27" font-weight="700">Context cost · deterministic token proxy</text><text x="56" y="94" fill="#64748b" font-size="16">Lower is better · ceil(normalized UTF-8 characters ÷ 4)</text>
    <rect x="650" y="47" width="14" height="14" rx="3" fill="url(#input)"/><text x="672" y="59" fill="#475569" font-size="13">loaded input</text><rect x="770" y="47" width="14" height="14" rx="3" fill="url(#output)"/><text x="792" y="59" fill="#475569" font-size="13">output</text>
    <line x1="258" y1="139" x2="258" y2="421" stroke="#e2e8f0"/><line x1="404" y1="139" x2="404" y2="421" stroke="#e2e8f0" stroke-dasharray="4 6"/><line x1="550" y1="139" x2="550" y2="421" stroke="#e2e8f0" stroke-dasharray="4 6"/><line x1="696" y1="139" x2="696" y2="421" stroke="#e2e8f0" stroke-dasharray="4 6"/><line x1="842" y1="139" x2="842" y2="421" stroke="#e2e8f0" stroke-dasharray="4 6"/>
    <g fill="#94a3b8" font-size="13" text-anchor="middle"><text x="258" y="450">0</text><text x="404" y="450">5k</text><text x="550" y="450">10k</text><text x="696" y="450">15k</text><text x="842" y="450">20k</text></g>
    <text x="56" y="187" fill="#334155" font-size="17" font-weight="600">Native agent</text><rect x="258" y="156" width="80" height="48" rx="12" fill="url(#output)"/><text x="353" y="187" fill="#334155" font-size="17" font-weight="700">2,751</text>
    <text x="56" y="283" fill="#4338ca" font-size="17" font-weight="700">Engineering Workflows</text><path d="M270 252h179v48H270a12 12 0 0 1-12-12v-24a12 12 0 0 1 12-12z" fill="url(#input)"/><path d="M449 252h71a12 12 0 0 1 12 12v24a12 12 0 0 1-12 12h-71z" fill="url(#output)"/><text x="547" y="283" fill="#4338ca" font-size="17" font-weight="800">9,403</text>
    <text x="56" y="379" fill="#334155" font-size="17" font-weight="600">Superpowers v6.1.1</text><path d="M270 348h436v48H270a12 12 0 0 1-12-12v-24a12 12 0 0 1 12-12z" fill="#8ea5ca"/><path d="M706 348h117a12 12 0 0 1 12 12v24a12 12 0 0 1-12 12H706z" fill="#64748b"/><text x="850" y="379" fill="#334155" font-size="17" font-weight="700">19,766</text>
    <rect x="563" y="235" width="271" height="35" rx="17.5" fill="#eef2ff"/><text x="699" y="258" text-anchor="middle" fill="#4f46e5" font-size="14" font-weight="700">52.4% less combined vs Superpowers</text>
    <text x="56" y="486" fill="#64748b" font-size="14">Native is cheapest; the skill adds context to improve planning discipline.</text><text x="56" y="510" fill="#94a3b8" font-size="12">Proxy only — not tokenizer output, latency, or billed usage · one planning-only run per condition</text>
  </g>
</svg>
